name: context-demo
on: push
jobs:
  show-context:
    runs-on: ubuntu-latest
    steps:
      - name: Print context values
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit ID: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"

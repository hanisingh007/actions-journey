name: report
on: push

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Create report
        run: |
          echo "Report generated on: $(date)" > report.txt
          echo "Run number: ${{ github.run_number }}" >> report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          retention-days: 5

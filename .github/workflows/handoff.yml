name: handoff
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create app file
        run: echo "app built on $(date)" > app.txt

      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download app package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Verify app.txt exists
        run: test -f app.txt

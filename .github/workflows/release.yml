name: release
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run lint
        run: echo "Linting the code"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run unit tests
        run: echo "Running unit tests"

  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Package the release
        run: echo "Packaging the release"
